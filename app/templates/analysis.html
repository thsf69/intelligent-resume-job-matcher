{% extends 'base.html' %}
{% block content %}
<h1>New Analysis</h1>
<div class="card">
    <form method="POST">
        <div class="form-group">
            <label>Select Resume</label>
            <select name="resume_id" class="form-control" required>
                <option value="" disabled selected>-- Select a Resume --</option>
                {% for resume in resumes %}
                    <option value="{{ resume.id }}">{{ resume.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label>Select Job Description</label>
            <select name="job_id" class="form-control" required>
                <option value="" disabled selected>-- Select a Job --</option>
                {% for job in jobs %}
                    <option value="{{ job.id }}">{{ job.title }} ({{ job.company }})</option>
                {% endfor %}
            </select>
        </div>
        
        <button type="submit" class="btn">Run Analysis</button>
    </form>
</div>
{% endblock %}
