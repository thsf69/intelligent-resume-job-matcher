{% extends 'base.html' %}
{% block content %}
<div class="flex-between">
    <h1>Your Resumes</h1>
</div>

<div class="card">
    <h2>Add New Resume</h2>
    <form method="POST" action="{{ url_for('resume.add_resume') }}" enctype="multipart/form-data">
        <div class="form-group">
            <label>Resume Name</label>
            <input type="text" name="name" class="form-control" placeholder="e.g. Software Engineer 2026" required>
        </div>
        <div class="form-group">
            <label>Paste Content</label>
            <textarea name="content" class="form-control" placeholder="Paste your resume text here..."></textarea>
        </div>
        <div class="form-group">
            <label>OR Upload .txt File</label>
            <input type="file" name="file" accept=".txt">
        </div>
        <button type="submit" class="btn">Add Resume</button>
    </form>
</div>

<div class="card">
    <h2>Saved Resumes</h2>
    {% if resumes %}
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Date Added</th>
                </tr>
            </thead>
            <tbody>
                {% for resume in resumes %}
                <tr>
                    <td>{{ resume.name }}</td>
                    <td>{{ resume.created_at.strftime('%Y-%m-%d') }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No resumes saved yet.</p>
    {% endif %}
</div>
{% endblock %}
